name: 电信营业厅每日签到
on:
  schedule:
    # 每天北京时间 8:00 自动执行（对应 UTC 0:00），可自行修改时间
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装脚本依赖
        run: npm install

      - name: 执行签到脚本
        env:
          # 账号配置：环境变量名必须和脚本内读取的名称一致，不可修改
          chinaTelecomAccount: ${{ secrets.CHINA_TELECOM_ACCOUNT }}
          # 以下为通知推送可选配置，按需添加，和青龙面板配置方式一致
          BARK_PUSH: ${{ secrets.BARK_PUSH }}
          BARK_SOUND: ${{ secrets.BARK_SOUND }}
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
        run: node 脚本.js
